services:

  mysql:
    image: mysql:8.0
    container_name: mysql-bankapp

    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - bankapp-network


  bankapp:
    container_name: ai-bank

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8081:8080"

    environment:
      MYSQL_HOST: mysql-bankapp
      MYSQL_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb
      MYSQL_PORT: 3306
      MYSQL_USER: root
      OLLAMA_URL: http://ollama:11434

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - bankapp-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - bankapp-network
    volumes:
      - ollama-data:/root/.ollama

networks:
  bankapp-network:
    driver: bridge


volumes:
  mysql-data:
  ollama-data: