apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp-deployment
  namespace: three-tier
  labels:
    app: bankapp

spec:
  strategy:
    type: RollingUpdate
  replicas: 2
  selector:
    matchLabels:
      app: bankapp

  template:
    metadata:
      labels:
        app: bankapp

    spec:
      containers:
        - name: bankapp
          image: aniruddhakharve/ai-bank-app:v1.1
          ports:
            - containerPort: 8080
        
          envFrom:
            - configMapRef:
                name: bankapp-config-map
            - secretRef:
                name: bankapp-mysql-secret

          