apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp-deployment
  namespace: three-tier
  labels:
    app: bankapp

spec:
  strategy:
    type: RollingUpdate
  replicas: 2
  selector:
    matchLabels:
      app: bankapp

  template:
    metadata:
      labels:
        app: bankapp

    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z mysql-service 3306; do echo waiting for mysql; sleep 2; done;']
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

        - name: wait-for-ollama
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z ollama-service 11434; do echo waiting for ollama; sleep 2; done;'] # FIXED: Pointed to ollama-service
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

      containers:
        - name: bankapp
          image: aniruddhakharve/ai-bank-app:v1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            
          envFrom:
            - configMapRef:
                name: bankapp-config-map
            - secretRef:
                name: bankapp-mysql-secret
