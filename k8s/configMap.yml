apiVersion: v1
kind: ConfigMap
metadata:
  name: bankapp-config-map
  namespace: three-tier
data:
#In or under data of ConfigMap file we add all the varaible which are not sensitive and can be shared across the pods.
  MYSQL_HOST: mysql-service
  MYSQL_DATABASE: bankappdb
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  OLLAMA_URL: http://ollama-service:11434  # FIXED: Pointed to the service name