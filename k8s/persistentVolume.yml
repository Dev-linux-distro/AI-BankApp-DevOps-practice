apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  namespace: three-tier
  labels:
    app: mysql

spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/mysql

---


apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-pv
  namespace: three-tier
  labels:
    app: ollama

spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/ollama