apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: three-tier

spec:
  selector:
    app: mysql
  ports:
    - port: 3306
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: bankapp-service
  namespace: three-tier

spec:
  type: NodePort
  selector:
    app:  bankapp
  ports:
    - port: 8080 # 1. Cluster Service Port (kube-proxy) , The port exposed inside the cluster 
      targetPort: 8080 # 2. Container/Pod Port , The port your bankapp container is listening on
      nodePort: 30080 # 3. Node Port , The port exposed on the node
  

---

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: three-tier

spec:
  selector:
    app:  ollama
  ports:
    - port: 11434
      targetPort: 11434
  type: NodePort
