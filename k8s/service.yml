apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: three-tier

spec:
  selector:
    app: mysql
  ports:
    - port: 3306
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: bankapp-service
  namespace: three-tier

spec:
  selector:
    app:  bankapp
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort